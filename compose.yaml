services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: stroybazaar-postgres
    network_mode: pasta
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stroybazaar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
